@if (isAuthRoute) {
  <router-outlet />
} @else {
  <div class="app-shell">
    <mat-toolbar color="primary" class="app-header">
      <div class="app-header__left">
        <span class="app-title">Explorar raza de gatitos</span>
      </div>

      <span class="app-header__spacer"></span>

      <div class="app-header__right">
        <button matButton="filled" type="button" class="logout-button" (click)="onLogout()">
          Cerrar sesión
        </button>
      </div>
    </mat-toolbar>

    <div class="app-body">
      <aside class="app-aside">
        <nav class="side-nav">
          <mat-nav-list>
            <a mat-list-item routerLink="/cats" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              Inicio gatos
            </a>
            <a mat-list-item routerLink="/cats/breeds" routerLinkActive="active">
              Consultar razas
            </a>
            <a mat-list-item routerLink="/profile" routerLinkActive="active">
              Perfil
            </a>
            <!-- No se muestra la ruta de login en el menú -->
          </mat-nav-list>
        </nav>
      </aside>

      <main class="app-content layout-container">
        <router-outlet />
      </main>
    </div>
  </div>
}
